<link rel="icon" type="image/png" href="../images/favicon-32.png">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script>
ISV.ready(function(){
  var me = ISV.auth.me();
  if (me && (me.role === "driver" || me.role === "owner")) location.replace("rides/");
  else location.replace("../account/?next=/driver/rides/" + (me ? "&denied=driver" : ""));
});
</script></body></html>
