<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Rides — I Served Transportation</title>
<link rel="stylesheet" href="../assets/base.css">
</head>
<body>
<div id="hdr"></div>

<main style="max-width:900px;margin:0 auto;padding:56px 32px 90px;display:flex;flex-direction:column;gap:26px;">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span class="kicker">Your account</span>
      <h1 style="margin:0;font:700 46px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.01em;">My rides</h1>
      <p id="whoLine" style="margin:0;font:400 16px/1.6 Figtree,sans-serif;color:oklch(0.50 0.015 250);"></p>
    </div>
    <div style="display:flex;gap:10px;">
      <a class="btn" href="../book/" style="padding:14px 22px;display:inline-block;">Book a ride</a>
      <button class="btn2" onclick="ISV.auth.signOut();location.href='../'">Sign out</button>
    </div>
  </div>

  <div id="list" style="display:flex;flex-direction:column;gap:16px;"></div>
</main>

<div id="ftr"></div>

<script src="../assets/config.js"></script>
<script src="../assets/app.js"></script>
<script>
ISV.root = "../";
var me = ISV.auth.require(null, "/my-rides/");
document.getElementById('hdr').innerHTML = ISV.header("../");
document.getElementById('ftr').innerHTML = ISV.footer("../");
if (me){
  document.getElementById('whoLine').textContent = "Signed in as " + me.email + ". Every ride you book while signed in shows up here.";
  function render(){
    var mine = ISV.book.mine(me).sort(function(a,b){ return b.created - a.created; });
    document.getElementById('list').innerHTML = mine.length ? mine.map(function(b){
      return '<div style="border:1px solid oklch(0.92 0.012 250);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;background:#fff;">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;">'+
        '<div style="display:flex;align-items:center;gap:12px;"><span style="font:700 18px/1 \'Barlow Condensed\',sans-serif;letter-spacing:0.02em;">'+ISV.fmtDate(b.date)+' · '+ISV.fmtTime(b.time)+'</span>'+ISV.pill(b.status)+'</div>'+
        '<span style="font:600 15px/1 Figtree,sans-serif;color:oklch(0.50 0.115 238);">'+ISV.money(b.fare)+' est.</span></div>'+
        '<div style="font:500 15px/1.5 Figtree,sans-serif;color:oklch(0.35 0.02 250);">'+ISV.esc(b.pickup)+' <span style="color:oklch(0.60 0.015 250);">→</span> '+ISV.esc(b.dropoff)+'</div>'+
        '<div style="font:400 13px/1.5 Figtree,sans-serif;color:oklch(0.55 0.015 250);">'+ISV.tripLine(b)+' · Request '+b.id+'</div>'+
        '</div>';
    }).join('') :
    '<div style="border:1px dashed oklch(0.88 0.02 250);border-radius:16px;padding:40px;text-align:center;font:400 16px/1.6 Figtree,sans-serif;color:oklch(0.55 0.015 250);">No rides yet. <a href="../book/">Book your first ride</a> and it will appear here with live status.</div>';
  }
  render();
  setInterval(render, 3000);
}
</script>
</body>
</html>
