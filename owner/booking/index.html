<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking - I Served Dispatch</title>
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../../images/favicon-32.png">
<link rel="apple-touch-icon" href="../../images/favicon-180.png">

<link rel="stylesheet" href="../../assets/base.css">
<style>body{background:oklch(0.975 0.006 250);}</style>
</head>
<body>
<div class="console">
  <div id="side"></div>
  <main id="main"></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="../../assets/config.js"></script>
<script src="../../assets/app.js"></script>
<script>
ISV.root = "../../";
ISV.ready(function(){
var me = ISV.auth.require("owner", "/owner/dashboard/");
if (me){
var id = new URLSearchParams(location.search).get('id');

document.getElementById('side').innerHTML = ISV.sidebar("../../", "dash", "Dispatch console", [
  { id:"dash", label:"Dashboard", href:"../dashboard/" },
  { id:"sched", label:"Schedules", href:"../schedules/" },
  { id:"pay", label:"Driver pay", href:"../pay/" },
  { id:"team", label:"Team", href:"../team/" },
  { id:"rep",  label:"Reports", href:"../reports/" }
]);

function fmtLogTime(t){ return new Date(t).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }

var EDITING = false;

function editForm(b){
  function inp(id, label, val, type, extra){
    return '<div style="display:flex;flex-direction:column;gap:7px;'+(extra||'')+'">'+
      '<label class="lbl">'+label+'</label>'+
      '<input id="'+id+'" class="inp" type="'+(type||"text")+'" value="'+ISV.esc(val==null?"":val)+'">'+
      '</div>';
  }
  var a = b.addOns || {};
  return '<div class="card" style="gap:18px;">'+
    '<span style="font:700 14px/1 Barlow,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.02 250);">Edit trip - everything is changeable</span>'+
    '<div class="grid2" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">'+
      inp('eName','Passenger name', b.name)+ inp('ePhone','Phone', b.phone)+
    '</div>'+
    inp('ePickup','Pickup address', b.pickup)+
    inp('eDropoff','Destination', b.dropoff)+
    '<div class="grid3" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">'+
      inp('eDate','Date', b.date, 'date')+ inp('eTime','Appointment time', b.time, 'time')+ inp('eMiles','Miles (total)', b.miles, 'number')+
    '</div>'+
    '<div class="grid3" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">'+
      '<div style="display:flex;flex-direction:column;gap:7px;"><label class="lbl">Trip type</label>'+
      '<select id="eTrip" class="inp"><option value="oneway"'+(b.tripType!=="round"?" selected":"")+'>One way</option><option value="round"'+(b.tripType==="round"?" selected":"")+'>Round trip</option></select></div>'+
      '<div style="display:flex;flex-direction:column;gap:7px;"><label class="lbl">Vehicle</label>'+
      '<select id="eVehicle" class="inp"><option value="sedan"'+(b.vehicle==="sedan"?" selected":"")+'>Sedan (ambulatory)</option><option value="wav"'+(b.vehicle==="wav"?" selected":"")+'>Wheelchair van</option><option value="stretcher"'+(b.vehicle==="stretcher"?" selected":"")+'>Stretcher / gurney</option></select></div>'+
      '<div style="display:flex;flex-direction:column;gap:7px;"><label class="lbl">Type of service</label>'+
      '<select id="eService" class="inp">'+(CONFIG.SERVICE_TYPES||[]).map(function(t){ return '<option value="'+t.id+'"'+(b.service===t.id?" selected":"")+'>'+t.label+'</option>'; }).join('')+'</select></div>'+
      '<div style="display:flex;flex-direction:column;gap:7px;"><label class="lbl">Riding along</label>'+
      '<select id="ePax" class="inp">'+[1,2,3,4].map(function(n){ return '<option value="'+n+'"'+(String(b.pax)===String(n)?" selected":"")+'>'+(n===1?"Just the passenger":"Passenger + "+(n-1))+'</option>'; }).join('')+'</select></div>'+
    '</div>'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap;">'+
      [['wait','Driver waits'],['assist','Door-through-door'],['afterHours','Before 6am / after 8pm']].map(function(x){
        return '<label style="display:flex;align-items:center;gap:8px;font:500 14px/1 Figtree,sans-serif;color:oklch(0.35 0.02 250);cursor:pointer;">'+
          '<input type="checkbox" id="eAdd_'+x[0]+'"'+(a[x[0]]?" checked":"")+' style="width:17px;height:17px;accent-color:oklch(0.62 0.115 237);">'+x[1]+'</label>';
      }).join('')+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:7px;"><label class="lbl">Driver notes</label>'+
    '<textarea id="eNotes" class="inp" rows="2" style="resize:vertical;">'+ISV.esc(b.notes||"")+'</textarea></div>'+
    '<div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;">'+
      inp('eFare','Fare ($)', b.fare, 'number', 'max-width:160px;')+
      '<button class="btn2" id="eRecalc" style="padding:13px 18px;font-size:14px;">Recalculate from details</button>'+
    '</div>'+
    '<div style="display:flex;gap:12px;">'+
      '<button class="btn" id="eSave" style="padding:14px 26px;font-size:15px;">Save changes</button>'+
      '<button class="btn2" id="eCancel" style="padding:14px 22px;font-size:15px;">Cancel</button>'+
    '</div>'+
  '</div>';
}

function readEditForm(){
  var v = function(id){ return document.getElementById(id).value; };
  var trip = v('eTrip');
  return {
    name: v('eName').trim(), phone: v('ePhone').trim(),
    pickup: v('ePickup').trim(), dropoff: v('eDropoff').trim(),
    date: v('eDate'), time: v('eTime'),
    tripType: trip, vehicle: v('eVehicle'), service: v('eService'), pax: v('ePax'),
    miles: parseFloat(v('eMiles')) || 0,
    addOns: { wait: document.getElementById('eAdd_wait').checked, assist: document.getElementById('eAdd_assist').checked, afterHours: document.getElementById('eAdd_afterHours').checked },
    notes: v('eNotes').trim(),
    fare: parseFloat(v('eFare')) || 0
  };
}

function render(){
  var b = ISV.book.byId(id);
  var m = document.getElementById('main');
  if (!b){ m.innerHTML = '<p style="font:400 16px/1.6 Figtree,sans-serif;">Booking not found. <a href="../dashboard/">← All bookings</a></p>'; return; }
  var drivers = ISV.auth.drivers().filter(function(d){ return d.active; });
  var f = { rows: [], total: b.fare };
  try { f = ISV.fare(b); } catch(e){}

  m.innerHTML =
  '<div style="display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;">'+
    '<div style="display:flex;flex-direction:column;gap:8px;">'+
      '<a href="../dashboard/" style="font:600 13px/1 Figtree,sans-serif;">← All bookings</a>'+
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'+
        '<h2 style="margin:0;font:700 34px/1.05 \'Barlow Condensed\',sans-serif;text-transform:uppercase;letter-spacing:0.01em;">'+b.id+'</h2>'+ISV.pill(b.status)+
      '</div></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
      (b.status === "Pending" ? '<button class="btn" id="approveRide" style="padding:12px 20px;font-size:14px;">Approve request</button>'+
        '<button class="btn2" id="rejectRide" style="padding:12px 18px;font-size:14px;color:oklch(0.50 0.15 25);">Decline</button>' : '')+
      '<button class="btn2" id="editTrip" style="padding:12px 18px;font-size:14px;">'+(EDITING?'Cancel editing':'Edit trip')+'</button>'+
      (b.status !== "Completed" && b.status !== "Cancelled" ? '<button class="btn2" id="markDone" style="padding:12px 18px;font-size:14px;">Mark completed</button>' : '')+
      (b.status !== "Cancelled" ? '<button class="btn2" id="cancelRide" style="padding:12px 18px;font-size:14px;color:oklch(0.50 0.15 25);">Cancel ride</button>'
                                : '<button class="btn2" id="reopenRide" style="padding:12px 18px;font-size:14px;">Reopen</button>')+
    '</div></div>'+

  '<div class="booking-grid" style="display:grid;grid-template-columns:1.15fr 0.85fr;gap:20px;align-items:start;">'+
    '<div style="display:flex;flex-direction:column;gap:20px;">'+
      (EDITING ? editForm(b) :
      '<div class="card" style="gap:0;padding:0;overflow:hidden;">'+
        '<div style="padding:16px 24px;background:oklch(0.985 0.008 237);border-bottom:1px solid oklch(0.93 0.01 250);font:700 14px/1 Barlow,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.02 250);">Trip</div>'+
        '<div style="padding:8px 24px 16px;">'+
          [["Pickup", ISV.mapLink(b.pickup), true], ["Destination", ISV.mapLink(b.dropoff), true], ["Date", ISV.fmtDate(b.date)+", "+(b.date||"").slice(0,4)], ["Appointment time", ISV.fmtTime(b.time)],
           ["Trip type", (b.tripType==="round"?"Round trip":"One way")+" · "+b.miles+" mi total"], ["Vehicle", ISV.vehicleName(b.vehicle)],
           ["Service", ISV.serviceLabel(b.service) || "Not specified"], ["Payor", b.payor || "Private pay"]]
          .map(function(r){ return '<div style="display:grid;grid-template-columns:170px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid oklch(0.96 0.006 250);">'+
            '<span style="font:500 14px/1.5 Figtree,sans-serif;color:oklch(0.56 0.015 250);">'+r[0]+'</span>'+
            '<span style="font:600 15px/1.5 Figtree,sans-serif;color:oklch(0.30 0.02 250);">'+(r[2] ? r[1] : ISV.esc(r[1]))+'</span></div>'; }).join('')+
        '</div></div>'+

      '<div class="card" style="gap:0;padding:0;overflow:hidden;">'+
        '<div style="padding:16px 24px;background:oklch(0.985 0.008 237);border-bottom:1px solid oklch(0.93 0.01 250);font:700 14px/1 Barlow,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.02 250);">Passenger &amp; notes</div>'+
        '<div style="padding:8px 24px 16px;">'+
          [["Name", b.name], ["Phone", b.phone], ["Riding along", (b.pax>1 ? "Passenger + "+(b.pax-1)+" companion"+(b.pax>2?"s":"") : "Just the passenger")], ["Driver notes", b.notes || "None"]]
          .map(function(r){ return '<div style="display:grid;grid-template-columns:170px 1fr;gap:16px;padding:12px 0;border-bottom:1px solid oklch(0.96 0.006 250);">'+
            '<span style="font:500 14px/1.5 Figtree,sans-serif;color:oklch(0.56 0.015 250);">'+r[0]+'</span>'+
            '<span style="font:600 15px/1.5 Figtree,sans-serif;color:oklch(0.30 0.02 250);">'+ISV.esc(r[1])+'</span></div>'; }).join('')+
          '<div style="display:flex;gap:10px;padding:14px 0 6px;">'+
            '<a class="btn2" style="padding:11px 16px;font-size:14px;" href="tel:'+ISV.esc(b.phone)+'">Call client</a>'+
            '<a class="btn2" style="padding:11px 16px;font-size:14px;" href="sms:'+ISV.esc(b.phone)+'">Text client</a>'+
          '</div>'+
        '</div></div>'+

      ''
      )+
      '<div class="card" style="gap:0;padding:0;overflow:hidden;">'+
        '<div style="padding:16px 24px;background:oklch(0.985 0.008 237);border-bottom:1px solid oklch(0.93 0.01 250);font:700 14px/1 Barlow,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.02 250);">Activity</div>'+
        '<div style="padding:12px 24px 18px;display:flex;flex-direction:column;gap:12px;">'+
          (b.log||[]).slice().reverse().map(function(l){
            return '<div style="display:flex;gap:12px;align-items:flex-start;">'+
              '<div style="margin-top:6px;width:8px;height:8px;border-radius:50%;background:oklch(0.62 0.115 237);flex:0 0 auto;"></div>'+
              '<div><div style="font:500 14px/1.5 Figtree,sans-serif;color:oklch(0.32 0.02 250);">'+ISV.esc(l.text)+'</div>'+
              '<div style="font:400 12px/1.4 Figtree,sans-serif;color:oklch(0.58 0.015 250);">'+fmtLogTime(l.t)+'</div></div></div>';
          }).join('')+
        '</div></div>'+
    '</div>'+

    '<div style="display:flex;flex-direction:column;gap:20px;">'+
      '<div class="card" style="gap:14px;">'+
        '<span style="font:700 14px/1 Barlow,sans-serif;letter-spacing:0.14em;text-transform:uppercase;color:oklch(0.45 0.02 250);">Assign driver</span>'+
        (function(){
          var decl = ISV.book.declinedBy(b);
          var out = '';
          if (decl.length){
            out += '<div style="padding:12px 14px;border-radius:10px;background:oklch(0.97 0.03 40);border:1px solid oklch(0.90 0.05 40);display:flex;flex-direction:column;gap:5px;">'+
              '<span style="font:700 12px/1 Barlow,sans-serif;letter-spacing:0.12em;text-transform:uppercase;color:oklch(0.48 0.14 35);">Declined '+decl.length+'x - needs another driver</span>'+
              decl.map(function(x){
                return '<span style="font:500 13px/1.5 Figtree,sans-serif;color:oklch(0.42 0.10 40);">'+ISV.esc(x.name)+(x.reason?': '+ISV.esc(x.reason):' (no reason given)')+'</span>';
              }).join('')+'</div>';
          }
          if (b.driverEmail && b.status === "Assigned"){
            out += '<div style="padding:12px 14px;border-radius:10px;background:oklch(0.97 0.03 85);border:1px solid oklch(0.90 0.04 80);font:500 13.5px/1.5 Figtree,sans-serif;color:oklch(0.46 0.10 72);">Waiting on the driver to accept. They have not confirmed yet - text or call them below, or reassign.</div>';
          }
          return out;
        })()+
        (b.status === "Pending" ? '<div style="padding:12px 14px;border-radius:10px;background:oklch(0.97 0.04 60);border:1px solid oklch(0.90 0.05 55);font:500 13.5px/1.5 Figtree,sans-serif;color:oklch(0.46 0.13 45);">Approve this request first - it stays out of the drivers\' consoles until you do.</div>' : '')+
        '<span style="font:400 14px/1.5 Figtree,sans-serif;color:oklch(0.52 0.015 250);">'+
          (b.driverEmail ? 'Assigned to <b>'+ISV.esc((ISV.auth.accounts().find(function(u){return u.email===b.driverEmail;})||{}).name || b.driverEmail)+'</b> ('+ISV.esc(b.driverEmail)+')'+(b.status==="Accepted"||b.status==="En route"||b.status==="Picked up"||b.status==="Completed" ? ' and accepted.' : '.')+'' : 'No driver on this ride yet.')+'</span>'+
        '<div style="display:flex;flex-direction:column;gap:8px;">'+
          (drivers.length ? drivers.map(function(d){
            var on = b.driverEmail === d.email;
            var saidNo = ISV.book.declinedBy(b).some(function(x){ return x.name === d.name; });
            return '<div data-assign="'+ISV.esc(d.email)+'" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid '+(on?'oklch(0.62 0.115 237)':'oklch(0.92 0.012 250)')+';border-radius:11px;background:'+(on?'oklch(0.62 0.115 237 / 0.06)':'#fff')+';">'+
              '<div style="display:flex;align-items:center;gap:11px;">'+ISV.avatar(d, 34)+
              '<div style="display:flex;flex-direction:column;gap:2px;">'+
                '<span style="font:600 14.5px/1.3 Figtree,sans-serif;color:oklch(0.30 0.02 250);">'+ISV.esc(d.name)+'</span>'+
                '<span style="font:400 12.5px/1.3 Figtree,sans-serif;color:oklch(0.55 0.015 250);">'+ISV.esc((d.vehicle||"Vehicle TBD")+(d.cred?' · '+d.cred:''))+(saidNo?' · already declined this ride':'')+'</span></div></div>'+
              '<span style="font:600 12px/1 Figtree,sans-serif;color:'+(on?'oklch(0.50 0.115 238)':saidNo?'oklch(0.55 0.13 40)':'oklch(0.55 0.015 250)')+';">'+(on?'Assigned ✓':saidNo?'Reassign anyway':'Assign')+'</span></div>';
          }).join('')
          : '<span style="font:400 14px/1.6 Figtree,sans-serif;color:oklch(0.55 0.015 250);">No drivers yet - add one on the <a href="../team/">Team</a> page (promote an account to driver by email).</span>')+
        '</div>'+
        (b.driverEmail ? (function(){
          var dp = ISV.auth.profile(b.driverEmail) || {};
          var dacc = ISV.auth.accounts().find(function(u){ return u.email === b.driverEmail; }) || {};
          var dphone = dp.phone || dacc.phone || "";
          var msg = ISV.driverRideText(b, dacc.name || "");
          return '<div style="display:flex;flex-direction:column;gap:10px;padding-top:4px;">'+
            (dphone
              ? '<div style="display:flex;gap:10px;flex-wrap:wrap;">'+
                  '<a class="btn" style="padding:12px 18px;font-size:14px;display:inline-block;" href="'+ISV.telHref(dphone)+'">Call driver</a>'+
                  '<a class="btn2" style="padding:12px 18px;font-size:14px;display:inline-block;" href="'+ISV.smsHref(dphone, msg)+'">Text ride details</a>'+
                '</div>'+
                '<span style="font:400 12.5px/1.5 Figtree,sans-serif;color:oklch(0.58 0.015 250);">"Text ride details" opens your messages with the whole trip already written out - just hit send.</span>'
              : '<span style="font:400 13px/1.6 Figtree,sans-serif;color:oklch(0.55 0.13 60);">No phone number saved for this driver. Add one on the <a href="../team/">Team</a> page to call or text them from here.</span>')+
          '</div>';
        })() : '')+
        (b.driverEmail ? '<button class="btn2" id="unassign" style="padding:11px;font-size:14px;">Unassign</button>' : '')+
        '<span style="font:400 12.5px/1.55 Figtree,sans-serif;color:oklch(0.58 0.015 250);">The ride appears in the driver\'s console the moment you assign it. (Text alerts hook in here when SMS is connected - see README.)</span>'+
      '</div>'+

      '<div class="card" style="gap:0;padding:0;overflow:hidden;">'+
        '<div style="padding:16px 22px;background:oklch(0.96 0.018 237);display:flex;flex-direction:column;gap:3px;">'+
          '<span style="font:600 11px/1 Barlow,sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.48 0.09 240);">Fare</span>'+
          '<span style="font:700 34px/1.05 \'Barlow Condensed\',sans-serif;color:oklch(0.30 0.04 245);">'+ISV.money(b.fare)+'</span></div>'+
        '<div style="padding:16px 22px;display:flex;flex-direction:column;gap:10px;background:#fff;">'+
          f.rows.map(function(r){ return '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;">'+
            '<span style="font:400 14px/1.4 Figtree,sans-serif;color:oklch(0.52 0.015 250);">'+r.label+'</span>'+
            '<span style="font:600 14px/1.4 Figtree,sans-serif;color:oklch(0.32 0.02 250);">'+r.amount+'</span></div>'; }).join('')+
          '<div style="height:1px;background:oklch(0.93 0.01 250);"></div>'+
          (function(){
            var state = ISV.book.chargeState(b);
            if (state === "paid"){
              return '<div style="padding:11px 13px;border-radius:9px;background:oklch(0.94 0.05 160);font:600 13px/1.5 Figtree,sans-serif;color:oklch(0.36 0.10 160);">Paid '+ISV.fmtDate(b.clientPaidOn)+(b.clientPaidMethod?' ('+ISV.esc(b.clientPaidMethod)+')':'')+
                '</div><button class="btn2" id="unpayClient" style="padding:10px;font-size:13px;">Mark unpaid</button>';
            }
            if (state === "due"){
              return '<div style="padding:11px 13px;border-radius:9px;background:oklch(0.97 0.03 85);font:600 13px/1.5 Figtree,sans-serif;color:oklch(0.48 0.10 72);">Payment due - the ride is completed.'+
                (b.billedOn ? '<div style="font-weight:500;margin-top:3px;">Bill sent '+ISV.fmtDate(b.billedOn)+'.</div>' : '<div style="font-weight:500;margin-top:3px;">No bill sent yet.</div>')+'</div>'+
                '<button class="btn2" id="billClient" style="padding:11px;font-size:13.5px;">'+(b.billedOn?'Resend bill':'Send bill to client')+'</button>'+
                (b.phone ? '<a class="btn2" style="padding:11px;font-size:13.5px;text-align:center;display:block;" href="'+ISV.smsHref(b.phone, ISV.book.clientBillText(b))+'">Text the bill</a>' : '')+
                '<button class="btn" id="payClient" style="padding:12px;font-size:14px;">Record payment received</button>';
            }
            return '<span style="font:400 13px/1.5 Figtree,sans-serif;color:oklch(0.55 0.015 250);">Charged when the ride is completed. Nothing is collected up front.</span>';
          })()+
        '</div></div>'+
    '</div>'+
  '</div>';

  var ap = document.getElementById('approveRide');
  if (ap) ap.onclick = function(){ ISV.book.approve(id, me.name); render(); };
  var rj = document.getElementById('rejectRide');
  if (rj) rj.onclick = function(){
    var why = prompt("Decline this request. Reason for the log?");
    if (why === null) return;
    ISV.book.reject(id, why, me.name); render();
  };
  document.getElementById('editTrip').onclick = function(){ EDITING = !EDITING; render(); };
  if (EDITING){
    document.getElementById('eCancel').onclick = function(){ EDITING = false; render(); };
    document.getElementById('eRecalc').onclick = function(){
      var f2 = readEditForm();
      var calc = ISV.fare(f2); // miles in the form are the trip total
      document.getElementById('eFare').value = calc.total.toFixed(2);
    };
    var eSvc = document.getElementById('eService');
    if (eSvc) eSvc.onchange = function(){
      var t = (CONFIG.SERVICE_TYPES||[]).find(function(x){ return x.id === this.value; }, this) || (CONFIG.SERVICE_TYPES||[]).find(function(x){ return x.id === eSvc.value; });
      if (t && t.vehicle) document.getElementById('eVehicle').value = t.vehicle;
    };
    document.getElementById('eSave').onclick = function(){
      var f2 = readEditForm();
      if (!f2.pickup || !f2.dropoff || !f2.name){ alert("Keep at least a name, pickup, and destination."); return; }
      ISV.book.update(id, f2, "Trip details edited by " + me.name);
      EDITING = false;
      render();
    };
  }
  document.querySelectorAll('[data-assign]').forEach(function(el){
    el.onclick = function(){
      var email = this.getAttribute('data-assign');
      var d = ISV.auth.accounts().find(function(u){ return u.email === email; });
      ISV.book.update(id, { driverEmail: email, status: "Assigned" }, "Assigned to " + (d ? d.name : email) + " by " + me.name);
      render();
    };
  });
  var un = document.getElementById('unassign');
  if (un) un.onclick = function(){ ISV.book.update(id, { driverEmail: null, status: "New" }, "Driver unassigned by " + me.name); render(); };
  var bc = document.getElementById('billClient');
  if (bc) bc.onclick = function(){
    bc.disabled = true; bc.textContent = "Sending...";
    ISV.book.billClient(id, me.name).then(function(){ render(); });
  };
  var pc = document.getElementById('payClient');
  if (pc) pc.onclick = function(){
    var how = prompt("Record payment of " + ISV.money(b.fare) + " from " + b.name + ".\nHow did they pay? (cash, card, Zelle, invoiced, broker)", "cash");
    if (how === null) return;
    ISV.book.markClientPaid(id, how.trim() || "cash", me.name); render();
  };
  var uc = document.getElementById('unpayClient');
  if (uc) uc.onclick = function(){ if (confirm("Mark this ride as unpaid again?")) { ISV.book.markClientUnpaid(id, me.name); render(); } };
  var md = document.getElementById('markDone');
  if (md) md.onclick = function(){ ISV.book.update(id, { status: "Completed" }, "Marked completed by dispatch"); render(); };
  var cr = document.getElementById('cancelRide');
  if (cr) cr.onclick = function(){ if (confirm("Cancel this ride?")) { ISV.book.update(id, { status: "Cancelled" }, "Cancelled by dispatch"); render(); } };
  var ro = document.getElementById('reopenRide');
  if (ro) ro.onclick = function(){ ISV.book.update(id, { status: b.driverEmail ? "Assigned" : "New" }, "Reopened by dispatch"); render(); };
}

render();
ISV.onChange(function(){ if (!EDITING) render(); });
setInterval(function(){ if (!EDITING) render(); }, 4000);
}

});
</script>
</body>
</html>
