<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — I Served Dispatch</title>
<link rel="stylesheet" href="../../assets/base.css">
<style>body{background:oklch(0.975 0.006 250);}</style>
</head>
<body>
<div class="console">
  <div id="side"></div>
  <main>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <span id="today" style="font:600 11px/1 Barlow,sans-serif;letter-spacing:0.16em;text-transform:uppercase;color:oklch(0.62 0.11 237);"></span>
        <h2 style="margin:0;font:700 34px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:0.01em;">Bookings</h2>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="../import/" class="btn2" style="padding:13px 20px;font-size:15px;display:inline-block;">Import rides</a>
        <a href="../../book/" class="btn" style="padding:13px 20px;font-size:15px;display:inline-block;">New booking</a>
      </div>
    </div>

    <div class="grid4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;">
      <div class="statcard"><span class="k">Rides today</span><span class="v" id="stToday">0</span><span class="s" id="stTodaySub"></span></div>
      <div class="statcard"><span class="k">Unassigned</span><span class="v" id="stUn">0</span><span class="s">Needs a driver</span></div>
      <div class="statcard"><span class="k">This week</span><span class="v" id="stWeek">0</span><span class="s" id="stWeekSub"></span></div>
      <div class="statcard"><span class="k">Revenue booked</span><span class="v" id="stRev">$0</span><span class="s">Week to date</span></div>
    </div>

    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <input id="search" class="inp" placeholder="Search passenger, address, or ID" style="max-width:340px;padding:12px 14px;font-size:14px;">
      <select id="fDriver" class="inp" style="max-width:190px;padding:12px 14px;font-size:14px;"><option value="">All drivers</option></select>
      <div id="chips" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
    </div>

    <div style="background:#fff;border:1px solid oklch(0.92 0.012 250);border-radius:14px;overflow:auto;">
      <table class="tbl" style="min-width:860px;">
        <thead><tr><th>Request</th><th>Passenger</th><th>Trip</th><th>Pickup</th><th>Driver</th><th>Fare</th><th>Status</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="emptyState" style="display:none;padding:44px;text-align:center;font:400 15px/1.7 Figtree,sans-serif;color:oklch(0.55 0.015 250);">
        No bookings yet. They appear here the moment someone submits the <a href="../../book/">booking form</a>.<br>
        <a href="#" id="seed">Load sample data</a> to see the console populated, or start clean.
      </div>
    </div>
    <div id="countLine" style="font:400 13px/1 Figtree,sans-serif;color:oklch(0.55 0.015 250);"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="../../assets/config.js"></script>
<script src="../../assets/app.js"></script>
<script>
ISV.root = "../../";
ISV.ready(function(){
var me = ISV.auth.require("owner", "/owner/dashboard/");
if (me){

function unassignedCount(){ return ISV.book.all().filter(function(b){ return !b.driverEmail && b.status !== "Cancelled" && b.status !== "Completed"; }).length; }

function sidebar(){
  document.getElementById('side').innerHTML = ISV.sidebar("../../", "dash", "Dispatch console", [
    { id:"dash", label:"Dashboard", href:"../dashboard/", badge: unassignedCount() || "" },
    { id:"team", label:"Team", href:"../team/" },
    { id:"rep",  label:"Reports", href:"../reports/" }
  ]);
}

var now = new Date();
document.getElementById('today').textContent = now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

var FILTERS = ["All","New","Assigned","En route","Completed","Cancelled"];
var fStatus = "All";
function bucket(s){ // group live statuses into mockup buckets
  if (s === "Accepted") return "Assigned";
  if (s === "Picked up") return "En route";
  return s;
}

function iso(d){ return d.toISOString().slice(0,10); }
function weekRange(){
  var d = new Date(); var day = (d.getDay() + 6) % 7; // Monday start
  var mon = new Date(d); mon.setDate(d.getDate() - day);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return [iso(mon), iso(sun)];
}

function stats(){
  var all = ISV.book.all();
  var t = iso(new Date());
  var todays = all.filter(function(b){ return b.date === t && b.status !== "Cancelled"; });
  var wr = weekRange();
  var week = all.filter(function(b){ return b.date >= wr[0] && b.date <= wr[1] && b.status !== "Cancelled"; });
  document.getElementById('stToday').textContent = todays.length;
  var enr = todays.filter(function(b){ return bucket(b.status) === "En route"; }).length;
  var un = todays.filter(function(b){ return !b.driverEmail; }).length;
  document.getElementById('stTodaySub').textContent = enr + " en route, " + un + " unassigned";
  document.getElementById('stUn').textContent = unassignedCount();
  document.getElementById('stWeek').textContent = week.length;
  document.getElementById('stWeekSub').textContent = "Mon–Sun this week";
  var rev = week.reduce(function(s,b){ return s + (b.fare||0); }, 0);
  document.getElementById('stRev').textContent = "$" + Math.round(rev).toLocaleString();
}

function chips(){
  document.getElementById('chips').innerHTML = FILTERS.map(function(f){
    return '<button class="chip'+(fStatus===f?' on':'')+'" data-f="'+f+'">'+f+'</button>';
  }).join('');
  document.querySelectorAll('[data-f]').forEach(function(el){ el.onclick=function(){ fStatus=this.getAttribute('data-f'); chips(); rows(); }; });
}

function driverFilter(){
  var sel = document.getElementById('fDriver');
  var cur = sel.value;
  sel.innerHTML = '<option value="">All drivers</option>' + ISV.auth.drivers().map(function(d){
    return '<option value="'+ISV.esc(d.email)+'">'+ISV.esc(d.name)+'</option>';
  }).join('');
  sel.value = cur;
}

function driverName(email){
  if (!email) return null;
  var d = ISV.auth.accounts().find(function(u){ return u.email === email; });
  return d ? d.name : email;
}

function rows(){
  var q = (document.getElementById('search').value || "").toLowerCase();
  var fd = document.getElementById('fDriver').value;
  var all = ISV.book.all().slice().sort(function(a,b){ return (b.date+(b.time||'')) < (a.date+(a.time||'')) ? -1 : 1; });
  var list = all.filter(function(b){
    if (fStatus !== "All" && bucket(b.status) !== fStatus) return false;
    if (fd && b.driverEmail !== fd) return false;
    if (q){
      var hay = (b.id+" "+b.name+" "+b.phone+" "+b.pickup+" "+b.dropoff).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  document.getElementById('emptyState').style.display = ISV.book.all().length ? "none" : "block";
  document.getElementById('rows').innerHTML = list.map(function(b){
    var dn = driverName(b.driverEmail);
    return '<tr class="click" onclick="location.href=\'../booking/?id='+b.id+'\'">'+
      '<td style="font:600 13px/1.4 Figtree,sans-serif;color:oklch(0.45 0.06 240);white-space:nowrap;">'+b.id+'</td>'+
      '<td><div style="font:600 14px/1.4 Figtree,sans-serif;color:oklch(0.28 0.02 250);">'+ISV.esc(b.name)+'</div>'+
      '<div style="font:400 13px/1.4 Figtree,sans-serif;color:oklch(0.55 0.015 250);">'+ISV.esc(b.phone)+'</div></td>'+
      '<td><div style="max-width:280px;">'+ISV.esc(b.pickup)+' <span style="color:oklch(0.60 0.015 250);">→</span> '+ISV.esc(b.dropoff)+'</div>'+
      '<div style="font:400 12.5px/1.4 Figtree,sans-serif;color:oklch(0.55 0.015 250);">'+ISV.tripLine(b)+'</div></td>'+
      '<td style="white-space:nowrap;"><div style="font:600 13.5px/1.4 Figtree,sans-serif;">'+ISV.fmtDate(b.date)+'</div>'+
      '<div style="font:400 13px/1.4 Figtree,sans-serif;color:oklch(0.55 0.015 250);">'+ISV.fmtTime(b.time)+'</div></td>'+
      '<td>'+(dn ? '<span style="font:500 13.5px/1.4 Figtree,sans-serif;">'+ISV.esc(dn)+'</span>'
                 : '<span style="font:600 12px/1 Figtree,sans-serif;color:oklch(0.55 0.13 60);background:oklch(0.97 0.03 85);padding:5px 10px;border-radius:999px;white-space:nowrap;">Assign →</span>')+'</td>'+
      '<td style="font:600 14px/1.4 Figtree,sans-serif;white-space:nowrap;">'+ISV.money(b.fare)+'</td>'+
      '<td>'+ISV.pill(b.status)+'</td></tr>';
  }).join('');
  document.getElementById('countLine').textContent = list.length + " of " + all.length + " bookings";
}

document.getElementById('search').addEventListener('input', rows);
document.getElementById('fDriver').addEventListener('change', rows);

document.getElementById('seed').onclick = function(e){
  e.preventDefault();
  var t = new Date(); var tm = new Date(); tm.setDate(t.getDate()+1);
  function iso2(d){ return d.toISOString().slice(0,10); }
  [
    { name:"Marcus Flanagan", phone:"(951) 555-0188", pickup:"35660 Carissa Ct, Wildomar", dropoff:"Inland Valley Medical Center", date:iso2(t), time:"10:00", tripType:"round", vehicle:"wav", addOns:{wait:true,assist:true,afterHours:false}, pax:"2", notes:"Uses a manual wheelchair; gate code 4412.", miles:24 },
    { name:"Alice Renner", phone:"(951) 555-0121", pickup:"24 Sage Ln, Murrieta", dropoff:"Loma Linda Dialysis", date:iso2(t), time:"06:30", tripType:"round", vehicle:"sedan", addOns:{wait:false,assist:false,afterHours:false}, pax:"1", notes:"Standing MWF schedule", miles:31 },
    { name:"Ernest Doyle", phone:"(951) 555-0104", pickup:"1188 Palomar St, Temecula", dropoff:"Temecula Valley Hospital", date:iso2(t), time:"13:15", tripType:"oneway", vehicle:"suv", addOns:{wait:false,assist:false,afterHours:false}, pax:"1", notes:"", miles:9 },
    { name:"Gloria Pace", phone:"(951) 555-0135", pickup:"781 Grand Ave, Lake Elsinore", dropoff:"Rite Aid + home", date:iso2(tm), time:"11:00", tripType:"round", vehicle:"sedan", addOns:{wait:true,assist:false,afterHours:false}, pax:"1", notes:"", miles:6 }
  ].forEach(function(b){ var f = ISV.fare(b); b.miles = f.miles; b.fare = +f.total.toFixed(2); ISV.book.add(b); });
  refresh();
};

function refresh(){ sidebar(); stats(); driverFilter(); rows(); }
chips(); refresh();
ISV.onChange(refresh);
setInterval(refresh, 4000);
}

});
</script>
</body>
</html>
